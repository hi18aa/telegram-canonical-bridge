[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-canonical-bridge"
version = "0.6.3"
description = "為 Hermes 主 Agent 提供可追蹤的 canonical Bot 派工 sidecar"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
packages = ["telegram_canonical_bridge"]

[tool.unittest]
start-directory = "tests"
