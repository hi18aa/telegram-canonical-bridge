# 合併到 Controller 的 <HERMES_HOME>/config.yaml。
# Telegram token、allowlist 與 home channel 仍由 `hermes gateway setup` 管理。

plugins:
  enabled:
    - telegram-canonical-bridge
  entries:
    telegram-canonical-bridge:
      allow_tool_override: false
      settings:
        # 使用 Hermes 原生 Telegram home channel 傳送任務時間線。
        # 若要固定 chat，可改為 telegram:<chat_id>。
        delivery_target: telegram

        # 只有列出的主 Agent profiles 可以建立與管理任務。
        controller_profiles:
          - default

        # 建議明確列出允許的 worker profiles 與責任。
        agents:
          operitrace-agent:
            role: OperiTrace 網站與瀏覽器操作助手
          research-agent:
            role: 研究與資料查證助手

        # 同一 worker 的工作會序列化；等待前一任務的最長秒數。
        lock_timeout_seconds: 3600

        # 同機附件是否先複製到共用 plugin-data。
        copy_attachments: true

# Controller 的 Telegram surface 要啟用 plugin toolset；可用 CLI 命令設定：
# hermes tools enable telegram_canonical_bridge --platform telegram
platform_toolsets:
  telegram:
    - hermes-telegram
    - telegram_canonical_bridge

platforms:
  # 這是 Hermes 原生 Telegram；其餘設定由 gateway setup 產生並保留。
  telegram:
    enabled: true

  # v0.4 的自管 adapter 只作相容保留。v0.5 sidecar 模式必須停用，
  # 避免它與原生 Telegram 同時輪詢同一個 token。
  telegram_canonical_bridge:
    enabled: false

# 每個 worker profile 另行安裝／啟用 plugin 與 cli toolset：
# hermes -p operitrace-agent plugins install https://github.com/hi18aa/telegram-canonical-bridge.git --enable
# hermes -p operitrace-agent tools enable telegram_canonical_bridge --platform cli
